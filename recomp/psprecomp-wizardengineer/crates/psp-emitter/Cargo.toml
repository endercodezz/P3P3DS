[package]
name = "psp-emitter"
version = "0.1.0"
edition = "2021"

[dependencies]
psp-ir = { path = "../psp-ir" }
psp-parser = { path = "../psp-parser" }
anyhow = "1"
rayon = "1"
indicatif = "0.18"
base64 = { version = "0.22", features = ["std"] }

[dev-dependencies]
# BIDS end-to-end test (issue #56) decodes the raw memset-tail words.
psp-decoder = { path = "../psp-decoder" }
