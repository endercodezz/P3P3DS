[package]
name = "psp-cli"
version = "0.1.0"
edition = "2021"
default-run = "psprecomp"

[[bin]]
name = "psprecomp"
path = "src/main.rs"

[dependencies]
psp-parser = { path = "../psp-parser" }
psp-decoder = { path = "../psp-decoder" }
psp-ir = { path = "../psp-ir" }
psp-optimizer = { path = "../psp-optimizer" }
psp-emitter = { path = "../psp-emitter" }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
goblin = { version = "0.9", features = ["elf32", "elf64"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indexmap = { version = "2", features = ["serde"] }
base64 = { version = "0.22", features = ["std"] }
toml = "1"
rayon = "1"
indicatif = "0.18"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
