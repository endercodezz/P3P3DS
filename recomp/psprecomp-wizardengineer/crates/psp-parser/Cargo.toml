[package]
name = "psp-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
goblin = { version = "0.9", features = ["elf32", "elf64"] }
byteorder = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
roxmltree = "0.20"
tracing = "0.1"
base64 = { version = "0.22", features = ["std"] }
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
