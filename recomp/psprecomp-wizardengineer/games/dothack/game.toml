# .hack//Link per-game manifest (issue #46 mechanism; schema in
# crates/psp-cli/src/config.rs and games/patapon/game.toml).
#
# Consumed by `psprecomp recompile data/dothack/analysis.json
#   --config games/dothack/game.toml -o <out>`.
# There is no games/dothack/runtime/ module yet — build the runtime with
# -DPSPRECOMP_GAME=none (pure generic, zero game hooks).

[game]
id    = "dothack"
title = ".hack//Link (ULJS-00266)"   # informational only

[recompile]
# Undiscovered prologue-less 5-instruction leaf on the CRI-FS enqueue path
# (L5 first-draw investigation, .planning/research/
# dothack-L5-first-draw-investigation.md §E/§"FIRST divergence"):
#
#   0x08A677D8: sw zero,0(a0); sw zero,4(a0); sw zero,8(a0)
#   0x08A677E4: jr ra; move v0,a0          # "zero a 12-byte record, return ptr"
#
# It sits in the Ghidra gap between FUN_08A67778 and FUN_08A677EC, has no
# prologue (no ADDIU sp), and is reached only indirectly — invisible to
# Ghidra, the prologue scan, and JAL-xref discovery. Every call therefore
# LOOKUP_MISSed into the no-op stub: the 12-byte CRI-init records at
# 0x08CA4230/3C/48 and 0x08D10568/74 stayed un-zeroed and v0 was garbage
# at all 6 call sites per boot — a candidate poison source for the CRI-FS
# bind livelock (io-request slot srv+144 never populated). Confirmed valid
# function start by raw-word decode; forcing the entry is the sanctioned
# per-game cure (generic gap-leaf discovery is the filed follow-up).
force_entries = [
    "0x08A677D8",
]
