name: Build platform (reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: "win-amd64 | mac-amd64 | mac-arm64 | linux-amd64 | linux-arm64"
        required: true
        type: string
      ref:
        description: "Git ref (SHA or tag) to check out and build"
        required: true
        type: string
      publish_mode:
        description: "'release' to upload as a GitHub release asset, 'artifact' to upload as a workflow artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name when publish_mode is 'artifact'"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "Derived build version string (REXGLUE_VERSION_STRING)"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ${{ fromJSON('{"win-amd64":"windows-latest","mac-amd64":"macos-26-intel","mac-arm64":"macos-26","linux-amd64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm"}')[inputs.platform] }}
    # linux-amd64 builds inside 22.04 so the glibc floor stays at 2.35, which is
    # what every downstream binary inherits. 24.04 puts it at 2.38, above Debian
    # stable and the older SteamOS releases. arm64 stays on the runner: FFmpeg's
    # checked-in config_linux_aarch64.h sets HAVE_ARC4RANDOM, and that call
    # needs glibc 2.36.
    container: ${{ inputs.platform == 'linux-amd64' && fromJSON('{"image":"ubuntu:22.04"}') || fromJSON('null') }}
    outputs:
      version: ${{ steps.version.outputs.v }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The container starts bare, and checkout needs git before it can clone.
      - name: Bootstrap container (linux-amd64)
        if: inputs.platform == 'linux-amd64'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg git git-lfs
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install toolchain (Windows)
        if: inputs.platform == 'win-amd64'
        run: choco install llvm cmake ninja -y

      - name: Install clang 20 (linux-amd64)
        if: inputs.platform == 'linux-amd64'
        run: |
          apt-get install -y --no-install-recommends software-properties-common lsb-release
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 20
          apt-get install -y clang-20 lld-20
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install clang 20 (linux-arm64)
        if: inputs.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          sudo apt-get install -y clang-20 lld-20
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build deps (macOS)
        if: startsWith(inputs.platform, 'mac-')
        run: brew install cmake ninja vulkan-loader molten-vk

      - name: Install build deps (linux-amd64)
        if: inputs.platform == 'linux-amd64'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | tee /etc/apt/trusted.gpg.d/lunarg.asc
          wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          # jammy's libstdc++ 11 has no <format>, and its cmake is 3.22 against a 3.25 minimum
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -qO- https://apt.kitware.com/keys/kitware-archive-latest.asc | gpg --dearmor -o /usr/share/keyrings/kitware.gpg
          echo "deb [signed-by=/usr/share/keyrings/kitware.gpg] https://apt.kitware.com/ubuntu/ jammy main" > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y cmake ninja-build build-essential g++-13 git curl unzip zip autoconf python3-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev vulkan-sdk \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Install build deps (linux-arm64)
        if: inputs.platform == 'linux-arm64'
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build build-essential git curl unzip autoconf python3.12-venv \
            libgtk-3-dev libx11-xcb-dev libxss-dev libvulkan-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: ${{ inputs.platform }}

      - name: Configure
        env:
          CC: ${{ fromJSON('{"win-amd64":"clang","mac-amd64":"/usr/bin/clang","mac-arm64":"/usr/bin/clang","linux-amd64":"clang-20","linux-arm64":"clang-20"}')[inputs.platform] }}
          CXX: ${{ fromJSON('{"win-amd64":"clang++","mac-amd64":"/usr/bin/clang++","mac-arm64":"/usr/bin/clang++","linux-amd64":"clang++-20","linux-arm64":"clang++-20"}')[inputs.platform] }}
        run: cmake --preset ${{ inputs.platform }} -DCMAKE_C_COMPILER="${{ env.CC }}" -DCMAKE_CXX_COMPILER="${{ env.CXX }}" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ${{ startsWith(inputs.platform, 'mac-') && '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3' || '' }}

      - name: Build and install
        run: cmake --build out/build/${{ inputs.platform }} --target install --parallel

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(sed -nE 's/^#define REXGLUE_VERSION_STRING "([^"]+)".*/\1/p' \
            out/build/${{ inputs.platform }}/include/rex/version.h)
          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: inputs.platform == 'win-amd64'
        shell: bash
        run: |
          cd out/install
          7z a "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Package (Unix)
        if: inputs.platform != 'win-amd64'
        run: |
          cd out/install
          zip -r "rexglue-sdk-${{ steps.version.outputs.v }}-${{ inputs.platform }}.zip" ${{ inputs.platform }}

      - name: Upload as release asset
        if: inputs.publish_mode == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload as workflow artifact
        if: inputs.publish_mode == 'artifact'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: out/install/rexglue-sdk-*-${{ inputs.platform }}.zip
          retention-days: 14
