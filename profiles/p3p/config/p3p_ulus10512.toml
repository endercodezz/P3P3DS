[game]
name = "Shin Megami Tensei: Persona 3 Portable"
disc_id = "ULUS-10512"
region = "NTSC-U"
module = "p3p"
ram_mb = 32
load_base = "0x08804000"

[input]
# Decrypted dump made from PSP_GAME/SYSDIR/EBOOT.BIN. The executable is
# intentionally not distributed with the repository.
executable = "profiles/p3p/game/eboot.elf"
game_root = "profiles/p3p/game/USRDIR"
functions_csv = "profiles/p3p/config/p3p_functions.csv"
nids_csv = "recomp/PSPRecomp/configs/nids.csv"

[output]
report_json = "experiments/p3p-analysis/p3p_report.json"
generated_cpp = "build/generated/p3p_generated.cpp"

[policy]
missing_function = "stop"
unsupported_instruction = "stop"
allow_interpreter_fallback = false
allow_jit_fallback = false
