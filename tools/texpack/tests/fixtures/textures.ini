# Round-trip pack for tests/test_texture_pack_roundtrip.cpp (issue #63):
# `p3p-texpack build` converts these synthetic fixtures, the C++ runtime reads
# them back. Keys are arbitrary; the images are power-of-two sized so `build`
# does not resample them.
[options]
hash = xxh64
ignoreAddress = true

[hashes]
000000000000000100000001 = all_values_16x16.png
000000000000000200000002 = pattern_16x8.png
000000000000000300000003 = rgb_16x16.png
000000000000000400000004 = gray_8x8.png
000000000000000500000005 = |
